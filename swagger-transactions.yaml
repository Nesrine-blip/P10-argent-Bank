swagger: '2.0'
info:
  title: Argent Bank - Transactions API
  description: API routes for transaction management
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http

# All routes require authentication
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: "Format: Bearer {token}"

paths:
  # ========================================
  # 1. VIEW ALL TRANSACTIONS FOR CURRENT MONTH
  # ========================================
  /user/transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Get all transactions for current month
      description: |
        Retrieves all transactions for the authenticated user 
        for the current month, grouped by account
      produces:
        - application/json
      responses:
        '200':
          description: Transactions successfully retrieved
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                type: array
                items:
                  $ref: '#/definitions/AccountWithTransactions'
        '401':
          description: Unauthorized - Missing or invalid token
        '500':
          description: Internal Server Error

  # ========================================
  # 2. VIEW TRANSACTION DETAILS
  # ========================================
  /user/transactions/{transactionId}:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Get details of a specific transaction
      description: Retrieves all detailed information for a transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          type: string
          description: Unique transaction ID (e.g. 507f1f77bcf86cd799439011)
      produces:
        - application/json
      responses:
        '200':
          description: Transaction details successfully retrieved
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                $ref: '#/definitions/TransactionDetails'
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error

  # ========================================
  # 3. ADD INFORMATION TO A TRANSACTION
  # ========================================
  /user/transactions/{transactionId}/info:
    post:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Add information to a transaction
      description: |
        Allows adding a category and/or notes to an existing transaction.
        The transaction itself is not modified, only metadata is added.
      parameters:
        - name: transactionId
          in: path
          required: true
          type: string
          description: Transaction ID (e.g. 507f1f77bcf86cd799439011)
        - name: body
          in: body
          required: true
          description: Information to add
          schema:
            $ref: '#/definitions/TransactionInfoUpdate'
      produces:
        - application/json
      responses:
        '200':
          description: Information successfully added
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                $ref: '#/definitions/TransactionDetails'
        '400':
          description: Bad Request - Invalid data
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error

  # ========================================
  # 4. UPDATE TRANSACTION INFORMATION
  # ========================================
    put:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Update transaction information
      description: |
        Allows modifying the category and/or notes of a transaction.
        Only custom information can be modified, 
        not the core banking data (amount, date, etc.)
      parameters:
        - name: transactionId
          in: path
          required: true
          type: string
          description: Transaction ID (e.g. 507f1f77bcf86cd799439011)
        - name: body
          in: body
          required: true
          description: New information
          schema:
            $ref: '#/definitions/TransactionInfoUpdate'
      produces:
        - application/json
      responses:
        '200':
          description: Information successfully updated
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                $ref: '#/definitions/TransactionDetails'
        '400':
          description: Bad Request - Invalid data
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error

  # ========================================
  # 5. DELETE TRANSACTION INFORMATION
  # ========================================
    delete:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Delete custom transaction information
      description: |
        Deletes the category and/or notes added by the user.
        The core banking transaction remains intact.
      parameters:
        - name: transactionId
          in: path
          required: true
          type: string
          description: Transaction ID (e.g. 507f1f77bcf86cd799439011)
      produces:
        - application/json
      responses:
        '200':
          description: Information successfully deleted
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                $ref: '#/definitions/TransactionDetails'
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error

# ========================================
# OBJECT DEFINITIONS (SCHEMAS)
# ========================================
definitions:
  # Account with transactions
  AccountWithTransactions:
    type: object
    properties:
      accountId:
        type: string
        description: Account ID (e.g. x8349)
      accountName:
        type: string
        description: Account name (e.g. Argent Bank Checking)
      balance:
        type: number
        format: float
        description: Current balance
      transactions:
        type: array
        description: List of transactions
        items:
          $ref: '#/definitions/Transaction'

  # Basic transaction
  Transaction:
    type: object
    properties:
      id:
        type: string
        description: Unique transaction ID
      date:
        type: string
        format: date-time
        description: Transaction date
      description:
        type: string
        description: Transaction description (e.g. Golden Sun Bakery)
      amount:
        type: number
        format: float
        description: Amount (positive for credit, negative for debit)
      balance:
        type: number
        format: float
        description: Balance after transaction

  # Complete transaction details
  TransactionDetails:
    type: object
    properties:
      id:
        type: string
        description: Unique ID
      date:
        type: string
        format: date-time
        description: Transaction date
      description:
        type: string
        description: Banking description
      amount:
        type: number
        format: float
        description: Transaction amount
      balance:
        type: number
        format: float
        description: Balance after transaction
      transactionType:
        type: string
        description: Transaction type
        enum: [debit, credit]
      category:
        type: string
        description: Custom category (e.g. Food, Transport)
      notes:
        type: string
        description: Personal notes

  # Data for adding/updating info
  TransactionInfoUpdate:
    type: object
    properties:
      category:
        type: string
        description: Transaction category (e.g. Food, Transport, Shopping)
      notes:
        type: string
        description: Personal notes (e.g. Bought bread and croissants)